name: Suggest blogs

# Once a week, looks for engineering blogs worth following and opens a pull request adding them to
# sources.yaml, or adds them to the one already open. Merging it follows them; closing it, or deleting an
# entry first, rejects them for good.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: suggest-blogs
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Model answers are cached per blog and newest post, so each week only asks about blogs that changed
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-assessments.json
          key: candidate-assessments-${{ github.run_id }}
          restore-keys: candidate-assessments-

      # If a suggestion PR is open, the entries still on its branch are carried over and new ones join them
      - run: npm run discover:candidates -- --apply --top 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_MIN_INTERVAL_MS: '6000'

      # The branch is rebuilt from main each time, so it never conflicts
      - name: Open or update the pull request
        run: |
          if [ ! -f .cache/blog-suggestions.md ]; then
            echo "Nothing new to suggest this week."
            exit 0
          fi
          git config user.name "Debangi"
          git config user.email "debangiofficial@gmail.com"
          git switch -C blog-suggestions
          git add sources.yaml
          git commit -m "feat: suggest new blogs to follow"
          git push --force origin blog-suggestions
          number=$(gh pr list --head blog-suggestions --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Suggested blogs to follow" --body-file .cache/blog-suggestions.md
          else
            gh pr create --base main --head blog-suggestions --title "Suggested blogs to follow" --body-file .cache/blog-suggestions.md
          fi
