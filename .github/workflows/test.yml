name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces an older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engfeed
          POSTGRES_PASSWORD: engfeed
          POSTGRES_DB: engfeed
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U engfeed" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://engfeed:engfeed@localhost:5432/engfeed?schema=public
      DIRECT_URL: postgresql://engfeed:engfeed@localhost:5432/engfeed?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
