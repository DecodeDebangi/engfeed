# The curated list of engineering blogs EngFeed follows. Run `npm run db:seed` after editing.
#
# To add a blog, give it a name, slug, websiteUrl and category; the feed and logo are found automatically.
# Only set rssUrl when discovery can't find the feed or picks the wrong one (for example a whole company
# blog instead of its engineering section). That pins the feed to this URL.
#
# Removing a blog retires it: it stops being polled, but its existing articles stay.

